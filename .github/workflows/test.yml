name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          # The plotting extra is installed because the plot suite
          # (tests/experiment/test_plots.py) is gated behind
          # ``pytest.importorskip("matplotlib")``: without it those tests are
          # collected, skipped, and reported green -- 18 tests that exist and
          # never run. Every plot module forces the Agg backend, so this is
          # headless-safe on the runner.
          uv pip install --system -e ".[plotting]"
          uv pip install --system pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/repl/test_modal_repl.py \
            --ignore=tests/clients/ \
            --cov=rlm \
            --cov-report=term-missing
