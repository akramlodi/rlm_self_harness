proposal_cache_path = ".cache/shrlm/proposals_obliq_bench_math_openrouter_blended_h0init.jsonl"
eval_repetitions = 3
# Matched to configs/experiment_oolong_pairs_blended_openrouter_
# DeepSeekV4Flash_relaxed.toml's own [operational] worker counts on
# 2026-11-12 (that config's values, not the uniform-2 this file briefly
# used): validation_workers=5 (baseline+candidate headroom, though only one
# of the two is ever actually live at a time -- see that config's own
# comment), validation_run_workers=3 (needs tau_early_stopping_enabled=false
# above to actually reach the candidate), screening_workers=2 (observed
# 429-free at mining/screening_run_workers=3 on OpenRouter),
# screening_run_workers=3, mining_run_workers=3. Operational, non-identity
# (only eval_repetitions is) -- safe to change under the existing --out-dir,
# resuming round 1 mining exactly where it left off.
validation_workers = 5
validation_run_workers = 3
mining_run_workers = 3
screening_workers = 2
screening_run_workers = 3
real_check_every_n_rounds = 0

[smoke.splits]
n_in = 3
n_ho = 3
test_short = 4
test_long = 2

[smoke.loop]
m = 1
v = 1
k = 2
t = 1

[smoke.caps]
