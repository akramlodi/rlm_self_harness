[pricing.promo]
input_per_million = 0.009
output_per_million = 1.28

[pricing.list_price]
input_per_million = 0.009
output_per_million = 1.28

[[gpu_scenarios]]
name = "h100_sxm_rented"
hourly_rate_usd = 2.49
provenance = "Median H100 SXM on-demand marketplace rate, 2026-08 (Lambda/RunPod listings)"
provenance_validated = true
sensitivity_range = [1.99, 3.49]
